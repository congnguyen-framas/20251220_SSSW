name: Build and Package Release (SSSW)

on:
  push:
    tags:
      - 'v*'      # Kích hoạt khi tạo tag mới (ví dụ: v1.0.1026.0900)
  workflow_dispatch: # Cho phép bấm chạy thủ công trên giao diện GitHub
    inputs:
      site_target:
        description: 'Chọn nhà máy cần đóng gói'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - fFT
          - fVN
      create_github_release:
        description: 'Tạo GitHub Release đính kèm file zip'
        required: true
        default: true
        type: boolean

permissions:
  contents: write # Cần quyền để upload file lên GitHub Releases

jobs:
  build:
    name: Build & Package (${{ matrix.site }})
    runs-on: windows-latest
    strategy:
      matrix:
        site: [fFT, fVN]
    # Nếu chạy thủ công và chọn 1 site cụ thể thì lọc bỏ site còn lại
    if: inputs.site_target == 'all' || inputs.site_target == matrix.site || github.event_name == 'push'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Configure Target Environment (${{ matrix.site }})
        shell: pwsh
        run: |
          Write-Host "Configuring for site: ${{ matrix.site }}"
          $propsPath = "SSSW/DeployConfig.props"
          
          # Đọc file DeployConfig.props và chuyển đổi đúng block <DeployDir>
          $content = Get-Content $propsPath -Raw
          if ("${{ matrix.site }}" -eq "fFT") {
            # Bật fFT, tắt fVN
            $content = $content -replace '(?s)<!--fFT-->\s*<!--\s*(<DeployDir>.*?</DeployDir>)\s*-->', "<!--fFT-->`n    `$1"
            $content = $content -replace '(?s)<!--fVN-->\s*(<DeployDir>.*?</DeployDir>)', "<!--fVN-->`n    <!--`$1-->"
          } else {
            # Bật fVN, tắt fFT
            $content = $content -replace '(?s)<!--fFT-->\s*(<DeployDir>.*?</DeployDir>)', "<!--fFT-->`n    <!--`$1-->"
            $content = $content -replace '(?s)<!--fVN-->\s*<!--\s*(<DeployDir>.*?</DeployDir>)\s*-->', "<!--fVN-->`n    `$1"
          }
          Set-Content -Path $propsPath -Value $content -Encoding UTF8

      - name: Restore NuGet Packages
        run: dotnet restore SSSW/SSSW.sln

      - name: Build Solution (Release)
        run: |
          # Build Release không copy lên network share (tránh fail trên cloud runner)
          dotnet build SSSW/SSSW.sln -c Release /p:DeployDir="bin\Release\net8.0-windows\DeployOutput\"

      - name: Prepare Release Artifacts
        shell: pwsh
        run: |
          $site = "${{ matrix.site }}"
          $zipSrc = "SSSW\bin\Release\net8.0-windows\Update.zip"
          $xmlSrc = "SSSW\bin\Release\net8.0-windows\update.xml"
          
          New-Item -ItemType Directory -Path "dist\$site" -Force
          Copy-Item $zipSrc -Destination "dist\$site\SSSW-$site-Update.zip"
          Copy-Item $xmlSrc -Destination "dist\$site\update-$site.xml"

      - name: Upload Artifacts to Pipeline
        uses: actions/upload-artifact@v4
        with:
          name: SSSW-${{ matrix.site }}-Release
          path: dist/${{ matrix.site }}/*

  publish-release:
    name: Create GitHub Release
    needs: build
    runs-on: windows-latest
    if: github.event_name == 'push' || inputs.create_github_release == true
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-dist

      - name: List Artifacts
        shell: pwsh
        run: Get-ChildItem -Path all-dist -Recurse

      - name: Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SSSW Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: all-dist/**/*
          generate_release_notes: true
